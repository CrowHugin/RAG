[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CrowHugin", email = "kuntz.bastien@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.14",
    "fire>=0.7.1",
    "semantic-text-splitter>=0.33.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
